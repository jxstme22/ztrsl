[package]
name = "audio-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
getrandom.workspace = true
serde.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = "0.11"
coreaudio-sys = "0.2"
cpal = "0.15.3"
# ScreenCaptureKit (macOS 13+) system-audio capture: no virtual device or
# driver needed to tap the system output mix, unlike the BlackHole route.
# `macos_13_0` enables audio capture + the sync clock. The crate is a thin
# safe binding used by macloop and other screen-capture apps.
screencapturekit = { version = "8", features = ["macos_13_0"] }

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.15.3"
windows = { version = "0.61", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.61"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
