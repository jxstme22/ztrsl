name: Smoke new models (Windows)

on:
  workflow_dispatch:

jobs:
  smoke-windows:
    name: Smoke new models
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python sidecar dependencies
        run: uv sync --extra dev --extra models

      - name: Smoke sensevoice + opus-mt (real providers)
        shell: pwsh
        run: |
          .venv\Scripts\python.exe scripts/ci_smoke_models.py all
