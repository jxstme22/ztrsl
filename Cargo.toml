[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/audio-core",
    "crates/diagnostics",
    "crates/ipc-protocol",
    "crates/model-manager",
    "crates/overlay-core",
    "crates/sidecar-supervisor",
    "crates/translation-runner",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core", "signature", "pkcs8"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
