[project]
name = "local-squad-inference"
version = "0.1.0"
description = "Local inference sidecar skeleton for Local Squad Translator."
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.11,<3",
    "websockets>=16,<17",
]

[project.optional-dependencies]
models = [
    "numpy>=2.3,<2.4",
    "onnxruntime==1.27.0",
    "huggingface-hub>=0.36,<1",
    "sherpa-onnx==1.13.4",
    "faster-whisper==1.2.1",
    "tokenizers>=0.23,<1",
]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
local-squad-inference = "local_squad_inference.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/inference/src/local_squad_inference"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["services/inference/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["services/inference/src", "services/inference/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["services/inference/src", "services/inference/tests"]
